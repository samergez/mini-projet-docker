version: '3.8'

services:
  db_service:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data  
      - ./init-db:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - app-network

  # --- ANCIEN SERVICE API_CHAT (Mis en commentaire car obsolète) ---
