  mailserver:
    image: axllent/mailpit
    container_name: mail_sandbox
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer_gui
    restart: always
    ports:
      - "8085:8080"
    depends_on:
      - db_service
    networks:
      - app-network

  ollama:
    container_name: ollama_local
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped
    networks:
      - app-network

  # --- NOUVEAU BACKEND DJANGO (Application Chat) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_chat_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env   # <-- Permet de charger automatiquement ton fichier .env
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

