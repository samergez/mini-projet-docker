version: '3.8'

services:
  db_service:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data  
      - ./init-db:/docker-entrypoint-initdb.d
    restart: always

  # api de chat + worker (fusionnés via entrypoint)
  api_chat:
    image: python:3.10-slim
    user: root # Requis pour pouvoir installer et lancer le service de planification système (cron)
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMTP_EMAIL=${SMTP_EMAIL}      
      - SMTP_PASSWORD=${SMTP_PASSWORD} 
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./api_chat:/app
      - ./email_agent_mock_data_handoff/email_agent_sandbox/dataset:/app/dataset
      - ./logs:/app/logs
      - ./received_emails:/app/received_emails
    working_dir: /app
    ports:
      - "8000:8000"
    # Installation de cron à la volée, attribution des droits à l'entrypoint, puis démarrage
    entrypoint: sh /app/entrypoint.sh
    restart: always
    depends_on:
      - db_service

  # Serveur de mail fictif local pour intercepter et lire les e-mails
  mailserver:
    image: axllent/mailpit
    container_name: mail_sandbox
    ports:
      - "8025:8025" # Interface web de Mailpit accessible sur Windows (http://localhost:8025)
      - "1025:1025" # Port SMTP pour envoyer les e-mails localement
    restart: always

  # --- INFRASTRUCTURE IA LOCALE (BLOC 3) ---
  ollama:
    container_name: ollama_local
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama  # Volume persistant pour sauvegarder le modèle d'embedding
    restart: unless-stopped

volumes:
  db_data:
  ollama_storage:  # Déclaration du volume pour Ollama